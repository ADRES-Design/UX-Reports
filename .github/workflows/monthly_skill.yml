name: Automated Monthly Skill

on:
  schedule:
    - cron: '0 0 1 * *' # Automatically runs at midnight on the 1st of every month
  workflow_dispatch: # Allows you to manually trigger it with a button to test it

jobs:
  run-skill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Needed for enterprise cloud authentication (OIDC) instead of a Console key

    steps:
      # 1. Pull down your repository code so the runner can see your files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Trigger the Claude GitHub Action you downloaded
      - name: Run Claude Skill
        uses: anthropics/claude-code-action@v1
        with:
          # We explicitly direct Claude to your preferred directory paths here
          prompt: |
            1. Look inside the directory: data/202607/
            2. Read the source input or instruction files located in that directory.
            3. Execute the automated skill logic based on those inputs.
            4. Write the final outputs as clean Markdown dashboard reports directly inside the dashboards/ folder.

      # 3. Automatically commit and push the new dashboard files back to your repository
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboards/
          git commit -m "chore: automated monthly dashboard update for July 2026" || echo "No changes to commit"
          git push
